name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write   # create GitHub pre-release + push tag
  packages: write   # push to ghcr.io

jobs:
  # ── Guard: version must be pre-release and not already released ───────────────
  check-version:
    name: Validate pre-release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract & validate version
        id: ver
        run: |
          TAG=$(grep '^version:' ha-addon-dev/config.yaml | sed "s/version: //;s/['\"]//g;s/ //g")
          echo "ha-addon-dev/config version: $TAG"

          # Reject pure semantic versions (X.Y.Z) — use the Release workflow instead
          if echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$TAG\" looks like a stable release. Use the Release workflow instead."
            exit 1
          fi

          # Prevent duplicate releases
          if git rev-parse "v${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag v${TAG} already exists. Bump ha-addon-dev/config.yaml before re-running."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${TAG}"
          git push origin "v${TAG}"

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG"    >> "$GITHUB_OUTPUT"

  # ── Build & push pre-release images ──────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan_dev:${{ needs.check-version.outputs.version }}
          labels: |
            org.opencontainers.image.title=SiapJalan dev (${{ matrix.arch }})
            org.opencontainers.image.description=Pre-release build
            org.opencontainers.image.url=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.source=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan_dev:cache
          cache-to: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan_dev:cache,mode=max

  # ── Create GitHub pre-release ─────────────────────────────────────────────────
  github-prerelease:
    name: Create GitHub Pre-release
    runs-on: ubuntu-latest
    needs: [check-version, build-and-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)" \
            --prerelease \
            --verify-tag 2>/dev/null || \
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --prerelease \
            --verify-tag

          BODY=$(gh release view "${TAG}" --json body -q .body)
          gh release edit "${TAG}" --notes "${BODY}

          ---

          ⚠️ **This is a pre-release for testing.** Use the **SiapJalan (dev)** addon channel.

          ## 🏠 Installation (Home Assistant — dev channel)

          1. Go to **Settings → Add-ons → Store → ⋮ → Repositories**
          2. Add: \`https://github.com/${REPO}\`
          3. Install **SiapJalan (dev)** → Start → open the **SiapJalan (dev)** sidebar panel
          4. Runs on port **8100** alongside the stable addon

          ## 🐳 Pre-built images (ghcr.io)

          | Architecture | Image |
          |---|---|
          | amd64   | \`ghcr.io/${REPO}/amd64-siap_jalan_dev:${VERSION}\`   |
          | aarch64 | \`ghcr.io/${REPO}/aarch64-siap_jalan_dev:${VERSION}\` |"
