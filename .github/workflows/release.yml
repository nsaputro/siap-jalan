name: Release

on:
  workflow_dispatch:

permissions:
  contents: write   # push tag, create GitHub release
  packages: write   # push to ghcr.io

jobs:
  # ── Validate NEXT_VERSION, create tag ────────────────────────────────────────
  prepare-release:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read NEXT_VERSION and create tag
        id: ver
        run: |
          VERSION=$(cat ha-addon/NEXT_VERSION | tr -d '[:space:]')
          echo "NEXT_VERSION: ${VERSION}"

          # Must be a pure X.Y.Z semver
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ha-addon/NEXT_VERSION '${VERSION}' is not a valid X.Y.Z version."
            exit 1
          fi

          # Guard against re-releasing
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Update ha-addon/NEXT_VERSION to the next version."
            exit 1
          fi

          git tag "v${VERSION}"
          git push origin "v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"

  # ── Build & push stable images ────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:${{ needs.prepare-release.outputs.version }}
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:latest
          labels: |
            org.opencontainers.image.title=SiapJalan (${{ matrix.arch }})
            org.opencontainers.image.description=Smart travel packing assistant
            org.opencontainers.image.url=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.source=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:cache
          cache-to: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:cache,mode=max

  # ── Create GitHub release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-and-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | grep -v "^${TAG}$" | grep -v 'b[0-9]*$' | head -n1)" \
            --verify-tag 2>/dev/null || \
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --verify-tag

          BODY=$(gh release view "${TAG}" --json body -q .body)
          gh release edit "${TAG}" --notes "${BODY}

          ---

          ## 🏠 Installation (Home Assistant)

          ### Stable addon
          1. Go to **Settings → Add-ons → Store → ⋮ → Repositories**
          2. Add: \`https://github.com/${REPO}\`
          3. Install **SiapJalan** → Start → open the **SiapJalan** sidebar panel

          ### Dev addon (latest unreleased build)
          Same repository URL — install **SiapJalan (dev)** from the same store entry.

          ## 🐳 Pre-built images (ghcr.io)

          | Architecture | Stable | Dev |
          |---|---|---|
          | amd64   | \`ghcr.io/${REPO}/amd64-siap_jalan:${VERSION}\`   | \`ghcr.io/${REPO}/amd64-siap_jalan_dev:dev\`   |
          | aarch64 | \`ghcr.io/${REPO}/aarch64-siap_jalan:${VERSION}\` | \`ghcr.io/${REPO}/aarch64-siap_jalan_dev:dev\` |

          ## 🖥️ Standalone (Docker Compose)

          \`\`\`bash
          git clone https://github.com/${REPO}
          cp backend/.env.example backend/.env   # add ANTHROPIC_API_KEY
          docker compose up --build
          # Frontend: http://localhost:5173  ·  API docs: http://localhost:8000/docs
          \`\`\`"
