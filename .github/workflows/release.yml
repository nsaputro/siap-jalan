name: Release

on:
  workflow_dispatch:

permissions:
  contents: write      # push tag, create GitHub release
  packages: write      # push to ghcr.io
  pull-requests: write # open post-release PR

jobs:
  # ── Validate NEXT_VERSION, create tag ────────────────────────────────────────
  prepare-release:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read NEXT_VERSION and create tag
        id: ver
        run: |
          VERSION=$(cat ha-addon/NEXT_VERSION | tr -d '[:space:]')
          echo "NEXT_VERSION: ${VERSION}"

          # Must be a pure X.Y.Z semver
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ha-addon/NEXT_VERSION '${VERSION}' is not a valid X.Y.Z version."
            exit 1
          fi

          # Guard against re-releasing
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Update ha-addon/NEXT_VERSION to the next version."
            exit 1
          fi

          git tag "v${VERSION}"
          git push origin "v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"

  # ── Build & push stable images ────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:${{ needs.prepare-release.outputs.version }}
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:latest
          labels: |
            org.opencontainers.image.title=SiapJalan (${{ matrix.arch }})
            org.opencontainers.image.description=Smart travel packing assistant
            org.opencontainers.image.url=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.source=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:cache
          cache-to: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:cache,mode=max

  # ── Create GitHub release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-and-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | grep -v "^${TAG}$" | grep -v 'b[0-9]*$' | head -n1)" \
            --verify-tag 2>/dev/null || \
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --verify-tag

          BODY=$(gh release view "${TAG}" --json body -q .body)
          gh release edit "${TAG}" --notes "${BODY}

          ---

          ## 🏠 Installation (Home Assistant)

          ### Stable addon
          1. Go to **Settings → Add-ons → Store → ⋮ → Repositories**
          2. Add: \`https://github.com/${REPO}\`
          3. Install **SiapJalan** → Start → open the **SiapJalan** sidebar panel

          ### Dev addon (latest unreleased build)
          Same repository URL — install **SiapJalan (dev)** from the same store entry.

          ## 🐳 Pre-built images (ghcr.io)

          | Architecture | Stable | Dev |
          |---|---|---|
          | amd64   | \`ghcr.io/${REPO}/amd64-siap_jalan:${VERSION}\`   | \`ghcr.io/${REPO}/amd64-siap_jalan_dev:dev\`   |
          | aarch64 | \`ghcr.io/${REPO}/aarch64-siap_jalan:${VERSION}\` | \`ghcr.io/${REPO}/aarch64-siap_jalan_dev:dev\` |

          ## 🖥️ Standalone (Docker Compose)

          \`\`\`bash
          git clone https://github.com/${REPO}
          cp backend/.env.example backend/.env   # add ANTHROPIC_API_KEY
          docker compose up --build
          # Frontend: http://localhost:5173  ·  API docs: http://localhost:8000/docs
          \`\`\`"

  # ── Create post-release PR ────────────────────────────────────────────────────
  create-post-release-pr:
    name: Create post-release PR
    runs-on: ubuntu-latest
    needs: [prepare-release, github-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create branch, update files, open PR
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # ── Compute versions ────────────────────────────────────────────────
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TODAY=$(date +%Y-%m-%d)
          BRANCH="chore/post-release-${VERSION}"

          # Previous stable tag for CHANGELOG comparison link
          OLD_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^v${VERSION}$" \
            | head -n1)
          # Fallback to initial commit if this is the first stable release
          if [ -z "$OLD_TAG" ]; then
            OLD_TAG=$(git rev-list --max-parents=0 HEAD | head -c 8)
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"

          # ── Bump config files ────────────────────────────────────────────────
          # ha-addon/config.yaml — released version so HA Supervisor offers the
          # update (image is already live on GHCR before this PR is created)
          sed -i "s/^version:.*/version: \"${VERSION}\"/" ha-addon/config.yaml

          # ha-addon/NEXT_VERSION — advance to next patch
          echo "${NEXT_VERSION}" > ha-addon/NEXT_VERSION

          # ha-addon-dev/config.yaml — track new NEXT_VERSION
          sed -i "s/^version:.*/version: \"${NEXT_VERSION}b1\"/" ha-addon-dev/config.yaml

          # ── Write changelog update script ────────────────────────────────────
          cat > /tmp/update_changelogs.py << 'PYEOF'
import re, pathlib, os

VERSION      = os.environ["VERSION"]
NEXT_VERSION = os.environ["NEXT_VERSION"]
TODAY        = os.environ["TODAY"]
OLD_TAG      = os.environ["OLD_TAG"]
REPO         = os.environ["REPO"]

changelog = pathlib.Path("CHANGELOG.md").read_text()

# Replace any [Unreleased] heading with the released section + fresh [Unreleased]
changelog = re.sub(
    r"## \[Unreleased\][^\n]*",
    f"## [Unreleased] — next: {NEXT_VERSION}\n\n## [{VERSION}] - {TODAY}",
    changelog, count=1,
)

# Update comparison links at the bottom
changelog = re.sub(
    r"\[Unreleased\]: https://[^\n]+",
    (
        f"[Unreleased]: https://github.com/{REPO}/compare/v{VERSION}...HEAD\n"
        f"[{VERSION}]: https://github.com/{REPO}/compare/{OLD_TAG}...v{VERSION}"
    ),
    changelog,
)
pathlib.Path("CHANGELOG.md").write_text(changelog)

# ── Build ha-addon/CHANGELOG.md from the newly-created VERSION section ──────
m = re.search(
    rf"## \[{re.escape(VERSION)}\] - {re.escape(TODAY)}\n(.*?)(?=\n## \[)",
    changelog, re.DOTALL,
)
entries_raw = m.group(1).strip() if m else ""

# Convert Keep-a-Changelog sections into compact "- Category: item" bullets
lines, category = [], None
for line in entries_raw.splitlines():
    if line.startswith("### "):
        category = line[4:].strip()
    elif line.startswith("- ") and category:
        lines.append(f"- {category}: {line[2:]}")

ha = f"## {VERSION}\n\n" + "\n".join(lines)
ha += (
    f"\n\n---\n\n"
    f"[Full changelog](https://github.com/{REPO}/blob/main/CHANGELOG.md)\n"
)
pathlib.Path("ha-addon/CHANGELOG.md").write_text(ha)
PYEOF

          # ── Run the script ───────────────────────────────────────────────────
          VERSION="$VERSION" NEXT_VERSION="$NEXT_VERSION" TODAY="$TODAY" \
          OLD_TAG="$OLD_TAG" REPO="$REPO" \
          python3 /tmp/update_changelogs.py

          # ── Commit & push ────────────────────────────────────────────────────
          git add ha-addon/config.yaml ha-addon/NEXT_VERSION ha-addon-dev/config.yaml \
                  CHANGELOG.md ha-addon/CHANGELOG.md
          git commit -m "chore: post-release ${VERSION} — config.yaml, changelogs, NEXT_VERSION → ${NEXT_VERSION}"
          git push origin "${BRANCH}"

          # ── Open PR ──────────────────────────────────────────────────────────
          gh pr create \
            --title "chore: post-release ${VERSION} — config, changelogs, NEXT_VERSION → ${NEXT_VERSION}" \
            --body "Automated post-release PR created by the Release workflow.

          ## Changes

          - \`ha-addon/config.yaml\` → \`${VERSION}\` — HA Supervisor will now offer the update; image is already live on GHCR
          - \`CHANGELOG.md\` — \`[Unreleased]\` entries moved to \`[${VERSION}] - ${TODAY}\`; comparison links updated
          - \`ha-addon/CHANGELOG.md\` — ${VERSION} user-facing notes (auto-extracted; review before merging)
          - \`ha-addon/NEXT_VERSION\` → \`${NEXT_VERSION}\`
          - \`ha-addon-dev/config.yaml\` → \`${NEXT_VERSION}b1\`

          > **Review \`ha-addon/CHANGELOG.md\`** — bullets are auto-generated from the main changelog and may benefit from a light edit for readability before merging." \
            --base main \
            --head "${BRANCH}"
