name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # triggered by tag push, e.g. v0.2.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without 'v', e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write   # create GitHub release + push tag
  packages: write   # push to ghcr.io

jobs:
  # ── Guard: config.yaml version must match the tag ────────────────────────────
  check-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract & validate version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME#v}"   # strip leading "v" from pushed tag
          fi

          CFG=$(grep '^version:' ha-addon/config.yaml | sed "s/version: //;s/['\"]//g;s/ //g")
          echo "Tag version:  $TAG"
          echo "config.yaml:  $CFG"

          if [ "$TAG" != "$CFG" ]; then
            echo "::error::Tag version ($TAG) does not match ha-addon/config.yaml version ($CFG)."
            echo "::error::Bump ha-addon/config.yaml before releasing."
            exit 1
          fi

          # workflow_dispatch: create and push the tag now
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "v${TAG}"
            git push -f origin "v${TAG}"
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=v$TAG"    >> "$GITHUB_OUTPUT"

  # ── Build & push stable images ────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:${{ needs.check-version.outputs.version }}
            ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:latest
          labels: |
            org.opencontainers.image.title=SiapJalan (${{ matrix.arch }})
            org.opencontainers.image.description=Smart travel packing assistant
            org.opencontainers.image.url=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.source=https://github.com/nsaputro/siap-jalan
            org.opencontainers.image.version=${{ needs.check-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:cache
          cache-to: type=registry,ref=ghcr.io/nsaputro/siap-jalan/${{ matrix.arch }}-siap_jalan:cache,mode=max

  # ── Create GitHub release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, build-and-push]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check-version.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)" \
            --verify-tag 2>/dev/null || \
          gh release create "${TAG}" \
            --title "SiapJalan v${VERSION}" \
            --generate-notes \
            --verify-tag

          BODY=$(gh release view "${TAG}" --json body -q .body)
          gh release edit "${TAG}" --notes "${BODY}

          ---

          ## 🏠 Installation (Home Assistant)

          ### Stable addon
          1. Go to **Settings → Add-ons → Store → ⋮ → Repositories**
          2. Add: \`https://github.com/${REPO}\`
          3. Install **SiapJalan** → Start → open the **SiapJalan** sidebar panel

          ### Dev addon (latest unreleased build)
          Same repository URL — install **SiapJalan (dev)** from the same store entry.

          ## 🐳 Pre-built images (ghcr.io)

          | Architecture | Stable | Dev |
          |---|---|---|
          | amd64   | \`ghcr.io/${REPO}/amd64-siap_jalan:${VERSION}\`   | \`ghcr.io/${REPO}/amd64-siap_jalan_dev:dev\`   |
          | aarch64 | \`ghcr.io/${REPO}/aarch64-siap_jalan:${VERSION}\` | \`ghcr.io/${REPO}/aarch64-siap_jalan_dev:dev\` |

          ## 🖥️ Standalone (Docker Compose)

          \`\`\`bash
          git clone https://github.com/${REPO}
          cp backend/.env.example backend/.env   # add ANTHROPIC_API_KEY
          docker compose up --build
          # Frontend: http://localhost:5173  ·  API docs: http://localhost:8000/docs
          \`\`\`"
