name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check config.yaml version matches input
        run: |
          VERSION=$(grep '^version:' ha-addon/config.yaml | sed "s/version: //;s/['\"]//g;s/ //g")
          echo "config.yaml version: $VERSION"
          echo "Input version:       ${{ github.event.inputs.version }}"
          if [ "$VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::config.yaml version $VERSION != input ${{ github.event.inputs.version }}"
            exit 1
          fi

  release:
    name: Build, push, and release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push HA Addon (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          tags: |
            ghcr.io/nsaputro/siap-jalan/amd64-siap_jalan:${{ github.event.inputs.version }}
            ghcr.io/nsaputro/siap-jalan/amd64-siap_jalan:latest

      - name: Build and push HA Addon (aarch64)
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
          tags: |
            ghcr.io/nsaputro/siap-jalan/aarch64-siap_jalan:${{ github.event.inputs.version }}
            ghcr.io/nsaputro/siap-jalan/aarch64-siap_jalan:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: SiapJalan v${{ github.event.inputs.version }}
          generate_release_notes: true
          body: |
            ## Install / Update

            ### Home Assistant Addon

            1. In HA, go to **Settings → Add-ons → Add-on Store**
            2. Click the three-dot menu (⋮) → **Repositories**
            3. Add `https://github.com/nsaputro/siap-jalan`
            4. Find **SiapJalan** in the store and click **Install**

            ### Docker Compose (standalone)

            ```bash
            git clone https://github.com/nsaputro/siap-jalan.git
            cp backend/.env.example backend/.env   # add your ANTHROPIC_API_KEY
            docker compose up --build
            ```

            Frontend: http://localhost:5173 · API: http://localhost:8000/docs
