name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (YAML + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML (stable + dev addon configs)
        run: |
          yamllint -c .yamllint.yml \
            ha-addon/config.yaml \
            ha-addon/build.yaml \
            ha-addon-dev/config.yaml \
            ha-addon-dev/build.yaml

      - name: Install hadolint
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: hadolint ha-addon/Dockerfile backend/Dockerfile

      - name: Validate ha-addon/NEXT_VERSION format
        run: |
          NEXT=$(cat ha-addon/NEXT_VERSION | tr -d '[:space:]')
          if ! echo "${NEXT}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::ha-addon/NEXT_VERSION '${NEXT}' must be a plain X.Y.Z version."
            exit 1
          fi
          echo "NEXT_VERSION: ${NEXT}  ✓"

      - name: Validate addon config.yaml files
        run: |
          python3 - <<'EOF'
          import yaml, sys
          configs = ["ha-addon/config.yaml", "ha-addon-dev/config.yaml"]
          required = ["name", "description", "version", "slug", "arch", "init", "image"]
          ok = True
          for path in configs:
              with open(path) as f:
                  cfg = yaml.safe_load(f)
              missing = [k for k in required if k not in cfg]
              if missing:
                  print(f"ERROR: {path} missing required keys: {missing}")
                  ok = False
              else:
                  print(f"  {path}  OK — v{cfg['version']}  slug={cfg['slug']}")
          if not ok:
              sys.exit(1)
          EOF

  # ── Python syntax ─────────────────────────────────────────────────────────────
  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ha-addon Python syntax
        run: |
          python3 -c "import ast, pathlib; [ast.parse(f.read_text()) for f in pathlib.Path('ha-addon/app').rglob('*.py')]"

      - name: Check backend Python syntax
        run: |
          python3 -c "import ast, pathlib; [ast.parse(f.read_text()) for f in pathlib.Path('backend/app').rglob('*.py')]"

  # ── Backend tests ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [python-syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: cd backend && python -m pytest tests/ -q

  # ── Frontend lint + build + tests ─────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build

      - name: Tests
        run: cd frontend && npm test -- --run

  # ── Docker build smoke test ───────────────────────────────────────────────────
  build-ha-addon:
    name: Build HA Addon (amd64)
    runs-on: ubuntu-latest
    needs: [lint, python-syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build HA Addon (no push)
        uses: docker/build-push-action@v6
        with:
          context: ha-addon
          file: ha-addon/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    name: Build Backend (amd64)
    runs-on: ubuntu-latest
    needs: [lint, python-syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build standalone backend (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

