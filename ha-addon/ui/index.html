<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siap Jalan</title>
  <style>
    :root {
      --bg:      var(--primary-background-color,   #f5f5f5);
      --card:    var(--card-background-color,      #ffffff);
      --text:    var(--primary-text-color,         #212121);
      --text2:   var(--secondary-text-color,       #727272);
      --muted:   var(--disabled-text-color,        #9ca3af);
      --accent:  var(--primary-color,              #2563eb);
      --div:     var(--divider-color,              #e0e0e0);
      --err:     var(--error-color,                #ef4444);
      --track:   var(--secondary-background-color, #e5e7eb);
      --shadow:  var(--ha-card-box-shadow,         0 1px 3px rgba(0,0,0,.08));
      --overlay: rgba(0,0,0,.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     var(--primary-background-color,   #111827);
        --card:   var(--card-background-color,      #1f2937);
        --text:   var(--primary-text-color,         #f3f4f6);
        --text2:  var(--secondary-text-color,       #9ca3af);
        --muted:  var(--disabled-text-color,        #6b7280);
        --accent: var(--primary-color,              #3b82f6);
        --div:    var(--divider-color,              #374151);
        --err:    var(--error-color,                #f87171);
        --track:  var(--secondary-background-color, #374151);
        --shadow: var(--ha-card-box-shadow,         0 1px 3px rgba(0,0,0,.35));
        --overlay: rgba(0,0,0,.6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #app { max-width: 640px; margin: 0 auto; padding: .75rem; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 0 .6rem; margin-bottom: .75rem;
      border-bottom: 1px solid var(--div);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header h1 span { color: var(--accent); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .4rem .8rem; border-radius: 6px; border: none;
      cursor: pointer; font-size: .875rem; font-weight: 500; transition: opacity .15s;
    }
    .btn:hover { opacity: .82; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--div); color: var(--text); }
    .btn-sm { padding: .25rem .55rem; font-size: .8rem; }
    .btn-icon {
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); padding: .2rem; line-height: 1; font-size: 1rem; transition: color .15s;
    }
    .btn-icon:hover { color: var(--err); }

    /* ── Trip card ── */
    .trip-card {
      background: var(--card); border-radius: 10px; box-shadow: var(--shadow);
      padding: .9rem 1rem; margin-bottom: .6rem; cursor: pointer; transition: opacity .15s;
    }
    .trip-card:hover { opacity: .9; }
    .trip-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .trip-dest { font-weight: 600; font-size: 1rem; }
    .trip-dates { font-size: .78rem; color: var(--text2); margin-top: .15rem; }
    .badges { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .4rem; }
    .badge {
      padding: .1rem .45rem; border-radius: 999px; font-size: .7rem; font-weight: 500;
      background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
    }
    .progress-bar { background: var(--track); border-radius: 999px; height: 5px; overflow: hidden; margin-top: .55rem; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
    .progress-label { font-size: .72rem; color: var(--text2); margin-top: .2rem; }

    /* ── Trip detail ── */
    .detail-header { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .detail-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .detail-meta { font-size: .78rem; color: var(--text2); margin-bottom: .5rem; }

    /* ── Packing card ── */
    .pack-card {
      background: var(--card); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
    }
    .pack-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .65rem 1rem; border-bottom: 1px solid var(--div);
    }
    .pack-card-title { font-size: .82rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
    .pack-count { font-size: .82rem; color: var(--text2); }
    .pack-count.done { color: var(--accent); font-weight: 600; }

    /* ── Item row ── */
    .item-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .55rem 1rem; border-bottom: 1px solid color-mix(in srgb, var(--div) 60%, transparent);
    }
    .item-row:last-of-type { border-bottom: none; }

    /* Circle checkbox */
    .item-check {
      appearance: none; -webkit-appearance: none;
      width: 1.25rem; height: 1.25rem; border-radius: 50%;
      border: 2px solid var(--div); flex-shrink: 0; cursor: pointer;
      background: transparent; transition: all .15s; position: relative;
    }
    .item-check:checked { background: var(--accent); border-color: var(--accent); }
    .item-check:checked::after {
      content: ''; position: absolute; top: 2px; left: 5px;
      width: 4px; height: 8px; border: 2px solid #fff;
      border-top: none; border-left: none; transform: rotate(45deg);
    }
    .item-name { flex: 1; font-size: .9rem; }
    .item-name.packed { text-decoration: line-through; color: var(--muted); }

    /* ── Inline add row ── */
    .add-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .55rem 1rem;
    }
    .add-icon { color: var(--text2); font-size: 1.15rem; flex-shrink: 0; line-height: 1; }
    .add-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: .88rem; color: var(--text); font-family: inherit;
    }
    .add-input::placeholder { color: var(--muted); }

    /* ── Modal ── */
    .modal-bg {
      position: fixed; inset: 0; background: var(--overlay);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--card); border-radius: 14px; padding: 1.25rem;
      width: min(95vw, 460px); max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .form-group { margin-bottom: .7rem; }
    .form-group label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: .25rem; color: var(--text2); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: .4rem .55rem; border: 1px solid var(--div); border-radius: 6px;
      font-size: .875rem; background: var(--bg); color: var(--text); outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 70px; resize: vertical; font-family: inherit; }
    .form-row { display: flex; gap: .5rem; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: .9rem; }
    .activity-grid { display: flex; flex-wrap: wrap; gap: .35rem; }
    .activity-btn {
      padding: .3rem .65rem; border-radius: 999px;
      border: 1px solid var(--div); background: var(--card); color: var(--text);
      cursor: pointer; font-size: .8rem; transition: all .15s;
    }
    .activity-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Activity section headers ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem .3rem;
      font-size: .75rem; font-weight: 600; letter-spacing: .06em;
      color: var(--text2); text-transform: uppercase;
      background: color-mix(in srgb, var(--div) 35%, transparent);
      border-top: 1px solid var(--div);
    }
    /* Avoid double border when section follows pack-card-header */
    .pack-card-header + .section-header { border-top: none; }
    .section-count { font-weight: 400; font-size: .75rem; }

    /* ── Misc ── */
    .empty  { text-align: center; color: var(--muted); padding: 2.5rem 0; font-size: .88rem; }
    .loading { text-align: center; color: var(--text2); padding: 2rem 0; font-size: .88rem; }
    .err-banner {
      background: color-mix(in srgb, var(--err) 12%, transparent);
      color: var(--err); border-radius: 6px; padding: .45rem .7rem;
      font-size: .82rem; margin-bottom: .6rem;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧳 Siap <span>Jalan</span></h1>
    <button class="btn btn-primary btn-sm" id="btn-new-trip">+ New Trip</button>
  </header>
  <div id="root"></div>
</div>

<!-- New Trip Modal -->
<div id="modal-trip" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>New Trip</h2>
    <div id="trip-err"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Destination *</label>
        <input id="f-dest" type="text" placeholder="e.g. Bali" />
      </div>
      <div class="form-group" style="max-width:90px">
        <label>Travellers</label>
        <input id="f-travellers" type="number" min="1" value="1" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date *</label>
        <input id="f-start" type="date" />
      </div>
      <div class="form-group">
        <label>End Date *</label>
        <input id="f-end" type="date" />
      </div>
    </div>
    <div class="form-group">
      <label>Activities</label>
      <div id="activity-picker" class="activity-grid">
        <span style="color:var(--muted);font-size:.8rem">Loading…</span>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Anything to remember…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="btn-cancel-trip">Cancel</button>
      <button class="btn btn-primary btn-sm" id="btn-save-trip">Create Trip</button>
    </div>
  </div>
</div>

<script>
// ── API (relative paths — HA ingress safe) ────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  if (res.status === 204) return null;
  return res.json();
}
const GET    = p      => api('GET',    p);
const POST   = (p, b) => api('POST',   p, b);
const DELETE = p      => api('DELETE', p);

// ── State ─────────────────────────────────────────────────────────────────────
let trips        = [];
let activities   = [];
let selectedActs = [];
let view         = 'trips';
let currentTrip  = null;
let currentList  = null;

// ── Render ────────────────────────────────────────────────────────────────────
function render() { view === 'trips' ? renderTrips() : renderTrip(); }

// ── Trip list ─────────────────────────────────────────────────────────────────
function renderTrips() {
  const root = document.getElementById('root');
  if (!trips.length) {
    root.innerHTML = '<div class="empty">No trips yet — create one to start packing ✈️</div>';
    return;
  }
  root.innerHTML = trips.map(t => {
    const items  = t.packing_lists?.[0]?.items || [];
    const packed = items.filter(i => i.is_packed).length;
    const total  = items.length;
    const pct    = total ? Math.round(packed / total * 100) : 0;
    const acts   = (t.activities || []).map(a => `<span class="badge">${esc(a)}</span>`).join('');
    return `
      <div class="trip-card" data-id="${t.id}">
        <div class="trip-card-top">
          <div>
            <div class="trip-dest">📍 ${esc(t.destination)}</div>
            <div class="trip-dates">${t.start_date} → ${t.end_date} · ${t.duration_days ?? '?'} days</div>
          </div>
          <button class="btn-icon del-trip" data-id="${t.id}">✕</button>
        </div>
        ${acts ? `<div class="badges">${acts}</div>` : ''}
        ${total ? `
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${packed} / ${total} packed</div>
        ` : ''}
      </div>`;
  }).join('');

  root.querySelectorAll('.trip-card').forEach(el =>
    el.addEventListener('click', () => openTrip(+el.dataset.id))
  );
  root.querySelectorAll('.del-trip').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); deleteTrip(+btn.dataset.id); })
  );
}

// ── Trip detail ───────────────────────────────────────────────────────────────
function renderItemRow(item) {
  return `
    <div class="item-row">
      <input type="checkbox" class="item-check toggle-item"
             data-item="${item.id}" ${item.is_packed ? 'checked' : ''} />
      <span class="item-name ${item.is_packed ? 'packed' : ''}">
        ${esc(item.name)}${item.quantity > 1 ? ` ×${item.quantity}` : ''}
      </span>
      <button class="btn-icon del-item" data-id="${item.id}">✕</button>
    </div>
  `;
}

function addRowHTML(slug, placeholder) {
  return `
    <div class="add-row">
      <span class="add-icon">+</span>
      <input class="add-input section-add" type="text"
             data-slug="${esc(slug)}" placeholder="${esc(placeholder)}" />
    </div>
  `;
}

function renderTrip() {
  const root   = document.getElementById('root');
  const t      = currentTrip;
  const items  = currentList?.items || [];
  const packed = items.filter(i => i.is_packed).length;
  const total  = items.length;
  const done   = total > 0 && packed === total;

  // Activity lookup map: slug → {name, icon_emoji}
  const actMap = {};
  activities.forEach(a => { actMap[a.slug] = a; });

  const tripActSlugs = t.activities || [];
  let sectionsHTML = '';

  if (tripActSlugs.length > 0) {
    // Build per-activity item buckets (trip activity order)
    const groupMap = {};
    tripActSlugs.forEach(s => { groupMap[s] = []; });
    const generalItems = [];

    items.forEach(item => {
      const srcs = item.source_activities || [];
      const match = srcs.find(s => groupMap[s] !== undefined);
      if (match) groupMap[match].push(item);
      else generalItems.push(item);
    });

    // Render one section per activity
    tripActSlugs.forEach(slug => {
      const group  = groupMap[slug];
      const act    = actMap[slug];
      const label  = act ? `${act.icon_emoji} ${esc(act.name)}` : esc(slug);
      const gPack  = group.filter(i => i.is_packed).length;
      const gTotal = group.length;
      sectionsHTML += `
        <div class="section-header">
          <span>${label}</span>
          ${gTotal > 0 ? `<span class="section-count">${gPack} / ${gTotal}</span>` : ''}
        </div>
        ${group.map(renderItemRow).join('')}
        ${addRowHTML(slug, `Add to ${act ? act.name : slug}…`)}
      `;
    });

    // General section — always shown so users can add non-activity items
    const gPack2  = generalItems.filter(i => i.is_packed).length;
    const gTotal2 = generalItems.length;
    sectionsHTML += `
      <div class="section-header">
        <span>General</span>
        ${gTotal2 > 0 ? `<span class="section-count">${gPack2} / ${gTotal2}</span>` : ''}
      </div>
      ${generalItems.map(renderItemRow).join('')}
      ${addRowHTML('', 'Add general item…')}
    `;
  } else {
    // No activities — flat list with a single add row
    sectionsHTML = items.map(renderItemRow).join('') + addRowHTML('', 'Type to add new item…');
  }

  root.innerHTML = `
    <div class="detail-header">
      <button class="btn btn-ghost btn-sm" id="btn-back">← Back</button>
      <span class="detail-title">📍 ${esc(t.destination)}</span>
    </div>
    <div class="detail-meta">
      ${t.start_date} → ${t.end_date} · ${t.duration_days ?? '?'} days
    </div>
    <div class="pack-card">
      <div class="pack-card-header">
        <span class="pack-card-title">Packing List</span>
        <span class="pack-count ${done ? 'done' : ''}">${packed} / ${total}</span>
      </div>
      ${sectionsHTML}
    </div>
  `;

  document.getElementById('btn-back').onclick = () => {
    view = 'trips'; currentTrip = null; currentList = null; loadTrips();
  };
  root.querySelectorAll('.toggle-item').forEach(cb =>
    cb.addEventListener('change', () => toggleItem(+cb.dataset.item))
  );
  root.querySelectorAll('.del-item').forEach(btn =>
    btn.addEventListener('click', () => deleteItem(+btn.dataset.id))
  );
  root.querySelectorAll('.section-add').forEach(inp =>
    inp.addEventListener('keydown', async e => {
      if (e.key !== 'Enter') return;
      const name = e.target.value.trim();
      if (!name) return;
      const slug = e.target.dataset.slug || null;
      e.target.value = '';
      await addItem(name, slug);
    })
  );
}

// ── Trip CRUD ─────────────────────────────────────────────────────────────────
async function loadTrips() {
  document.getElementById('root').innerHTML = '<div class="loading">Loading…</div>';
  trips = await GET('trips');
  render();
}

async function openTrip(id) {
  currentTrip = trips.find(t => t.id === id);
  const lists = await GET(`trips/${id}/lists`);
  currentList = lists[0] || null;
  if (currentList) currentList.items = await GET(`lists/${currentList.id}/items`);
  view = 'trip';
  render();
}

async function deleteTrip(id) {
  if (!confirm('Delete this trip?')) return;
  await DELETE(`trips/${id}`);
  trips = trips.filter(t => t.id !== id);
  render();
}

async function createTrip() {
  const dest  = document.getElementById('f-dest').value.trim();
  const start = document.getElementById('f-start').value;
  const end   = document.getElementById('f-end').value;
  const errEl = document.getElementById('trip-err');
  errEl.innerHTML = '';
  if (!dest || !start || !end) {
    errEl.innerHTML = '<div class="err-banner">Please fill in destination and dates.</div>';
    return;
  }
  if (start > end) {
    errEl.innerHTML = '<div class="err-banner">End date must be after start date.</div>';
    return;
  }
  try {
    const trip = await POST('trips', {
      destination: dest, start_date: start, end_date: end,
      traveller_count: +document.getElementById('f-travellers').value || 1,
      activities: selectedActs,
      notes: document.getElementById('f-notes').value.trim() || null,
    });
    trips.unshift(trip);
    closeModal('modal-trip');
    render();
  } catch (e) {
    errEl.innerHTML = `<div class="err-banner">${esc(e.message)}</div>`;
  }
}

// ── Item CRUD ─────────────────────────────────────────────────────────────────
async function addItem(name, activitySlug = null) {
  if (!currentList) return;
  const body = { name, quantity: 1, is_essential: false, added_by: activitySlug ? 'adhoc' : 'user' };
  if (activitySlug) body.source_activity = activitySlug;
  const item = await POST(`lists/${currentList.id}/items`, body);
  currentList.items.push(item);
  renderTrip();
  // Re-focus the same add input
  const refSlug = activitySlug ?? '';
  const inp = document.querySelector(`.section-add[data-slug="${refSlug}"]`);
  if (inp) inp.focus();
}

async function toggleItem(itemId) {
  const item = await POST(`items/${itemId}/toggle`);
  const idx  = currentList.items.findIndex(i => i.id === itemId);
  if (idx !== -1) currentList.items[idx] = item;
  renderTrip();
}

async function deleteItem(itemId) {
  await DELETE(`items/${itemId}`);
  currentList.items = currentList.items.filter(i => i.id !== itemId);
  renderTrip();
}

// ── Activities picker ─────────────────────────────────────────────────────────
async function loadActivities() {
  activities = await GET('activities');
  renderActivityPicker();
}

function renderActivityPicker() {
  const el = document.getElementById('activity-picker');
  if (!el) return;
  el.innerHTML = activities.map(a => `
    <button class="activity-btn ${selectedActs.includes(a.slug) ? 'selected' : ''}"
            data-slug="${a.slug}">${a.icon_emoji} ${esc(a.name)}</button>
  `).join('');
  el.querySelectorAll('.activity-btn').forEach(btn =>
    btn.addEventListener('click', () => {
      const s = btn.dataset.slug;
      selectedActs = selectedActs.includes(s)
        ? selectedActs.filter(x => x !== s) : [...selectedActs, s];
      renderActivityPicker();
    })
  );
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Wire up ───────────────────────────────────────────────────────────────────
document.getElementById('btn-new-trip').onclick = () => {
  selectedActs = [];
  ['f-dest','f-start','f-end','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-travellers').value = '1';
  document.getElementById('trip-err').innerHTML = '';
  renderActivityPicker();
  openModal('modal-trip');
};
document.getElementById('btn-cancel-trip').onclick = () => closeModal('modal-trip');
document.getElementById('btn-save-trip').onclick   = createTrip;
document.querySelectorAll('.modal-bg').forEach(bg =>
  bg.addEventListener('click', e => { if (e.target === bg) bg.style.display = 'none'; })
);

loadActivities();
loadTrips();
</script>
</body>
</html>
