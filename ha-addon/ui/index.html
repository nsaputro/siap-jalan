<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siap Jalan</title>
  <style>
    /* ── HA theme variables with light fallbacks ─────────────────────────────
       HA injects --primary-color, --primary-background-color, etc. into the
       ingress iframe automatically. The dark-mode media query provides
       fallbacks when the page is accessed outside HA.                        */
    :root {
      --sj-bg:          var(--primary-background-color,   #f5f5f5);
      --sj-card:        var(--card-background-color,      #ffffff);
      --sj-text:        var(--primary-text-color,         #212121);
      --sj-text-2:      var(--secondary-text-color,       #727272);
      --sj-text-muted:  var(--disabled-text-color,        #9ca3af);
      --sj-accent:      var(--primary-color,              #2563eb);
      --sj-divider:     var(--divider-color,              #e0e0e0);
      --sj-error:       var(--error-color,                #ef4444);
      --sj-track:       var(--secondary-background-color, #e5e7eb);
      --sj-shadow:      var(--ha-card-box-shadow,         0 1px 4px rgba(0,0,0,.08));
      --sj-overlay:     rgba(0,0,0,.45);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --sj-bg:         var(--primary-background-color,   #111827);
        --sj-card:       var(--card-background-color,      #1f2937);
        --sj-text:       var(--primary-text-color,         #f3f4f6);
        --sj-text-2:     var(--secondary-text-color,       #9ca3af);
        --sj-text-muted: var(--disabled-text-color,        #6b7280);
        --sj-accent:     var(--primary-color,              #3b82f6);
        --sj-divider:    var(--divider-color,              #374151);
        --sj-error:      var(--error-color,                #f87171);
        --sj-track:      var(--secondary-background-color, #374151);
        --sj-shadow:     var(--ha-card-box-shadow,         0 1px 4px rgba(0,0,0,.4));
        --sj-overlay:    rgba(0,0,0,.6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--sj-bg);
      color: var(--sj-text);
    }

    #app { max-width: 800px; margin: 0 auto; padding: 1rem; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 0; margin-bottom: 1rem;
      border-bottom: 2px solid var(--sj-divider);
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header h1 span { color: var(--sj-accent); }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .45rem .9rem; border-radius: 6px; border: none;
      cursor: pointer; font-size: .9rem; font-weight: 500;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .82; }
    .btn-primary { background: var(--sj-accent); color: #fff; }
    .btn-danger  { background: var(--sj-error);  color: #fff; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--sj-divider);
      color: var(--sj-text);
    }
    .btn-sm { padding: .3rem .6rem; font-size: .8rem; }

    /* ── Cards ───────────────────────────────────────────────────────────── */
    .card {
      background: var(--sj-card);
      border-radius: 10px;
      box-shadow: var(--sj-shadow);
      padding: 1rem;
      margin-bottom: .75rem;
    }
    .card-title { font-weight: 600; font-size: 1rem; margin-bottom: .25rem; }
    .card-meta  { font-size: .8rem; color: var(--sj-text-2); }

    /* ── Badge ───────────────────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: .15rem .5rem; border-radius: 999px;
      font-size: .75rem; font-weight: 500;
      background: color-mix(in srgb, var(--sj-accent) 18%, transparent);
      color: var(--sj-accent);
      margin-right: .25rem; margin-bottom: .25rem;
    }

    /* ── Progress bar ────────────────────────────────────────────────────── */
    .progress-bar {
      background: var(--sj-track);
      border-radius: 999px; height: 8px; overflow: hidden; margin: .5rem 0;
    }
    .progress-fill {
      height: 100%; background: var(--sj-accent);
      border-radius: 999px; transition: width .3s;
    }

    /* ── Item rows ───────────────────────────────────────────────────────── */
    .item-row {
      display: flex; align-items: center; gap: .5rem;
      padding: .4rem 0; border-bottom: 1px solid var(--sj-divider);
    }
    .item-row:last-child { border-bottom: none; }
    .item-row input[type=checkbox] {
      accent-color: var(--sj-accent); width: 1rem; height: 1rem; flex-shrink: 0;
    }
    .item-row .item-name { flex: 1; font-size: .9rem; }
    .item-row .item-name.packed {
      text-decoration: line-through; color: var(--sj-text-muted);
    }

    /* ── Modal ───────────────────────────────────────────────────────────── */
    .modal-bg {
      position: fixed; inset: 0;
      background: var(--sj-overlay);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--sj-card);
      border-radius: 12px; padding: 1.5rem;
      width: min(95vw, 480px); max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }

    /* ── Forms ───────────────────────────────────────────────────────────── */
    .form-group { margin-bottom: .8rem; }
    .form-group label {
      display: block; font-size: .85rem; font-weight: 500;
      margin-bottom: .3rem; color: var(--sj-text);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%; padding: .45rem .6rem;
      border: 1px solid var(--sj-divider); border-radius: 6px;
      font-size: .9rem;
      background: var(--sj-bg);
      color: var(--sj-text);
      outline: none;
      transition: border-color .15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--sj-accent);
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: flex; gap: .5rem; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }

    /* ── Activity picker ─────────────────────────────────────────────────── */
    .activity-grid { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
    .activity-btn {
      padding: .35rem .7rem; border-radius: 999px;
      border: 1px solid var(--sj-divider);
      background: var(--sj-card); color: var(--sj-text);
      cursor: pointer; font-size: .85rem; transition: all .15s;
    }
    .activity-btn.selected {
      background: var(--sj-accent); color: #fff; border-color: var(--sj-accent);
    }

    /* ── Misc ────────────────────────────────────────────────────────────── */
    .section-title {
      font-size: .95rem; font-weight: 600;
      color: var(--sj-text-2); margin: .75rem 0 .4rem;
    }
    .empty { text-align: center; color: var(--sj-text-muted); padding: 2rem 0; font-size: .9rem; }
    .error-msg {
      background: color-mix(in srgb, var(--sj-error) 15%, transparent);
      color: var(--sj-error);
      border-radius: 6px; padding: .5rem .75rem; font-size: .85rem; margin-bottom: .75rem;
    }
    .loading { text-align: center; color: var(--sj-text-2); padding: 2rem 0; }

    nav { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .nav-tab {
      padding: .4rem .85rem; border-radius: 6px; border: none;
      background: transparent; cursor: pointer;
      font-size: .9rem; font-weight: 500;
      color: var(--sj-text-2); transition: all .15s;
    }
    .nav-tab.active { background: var(--sj-accent); color: #fff; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧳 Siap <span>Jalan</span></h1>
    <button class="btn btn-primary" id="btn-new-trip">+ New Trip</button>
  </header>
  <div id="root"></div>
</div>

<!-- New Trip Modal -->
<div id="modal-trip" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>New Trip</h2>
    <div id="trip-error"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Destination *</label>
        <input id="f-dest" type="text" placeholder="e.g. Bali" />
      </div>
      <div class="form-group">
        <label>Travellers</label>
        <input id="f-travellers" type="number" min="1" value="1" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date *</label>
        <input id="f-start" type="date" />
      </div>
      <div class="form-group">
        <label>End Date *</label>
        <input id="f-end" type="date" />
      </div>
    </div>
    <div class="form-group">
      <label>Activities</label>
      <div id="activity-picker" class="activity-grid"><span style="color:var(--sj-text-muted);font-size:.85rem">Loading…</span></div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Any notes…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btn-cancel-trip">Cancel</button>
      <button class="btn btn-primary" id="btn-save-trip">Create Trip</button>
    </div>
  </div>
</div>

<!-- Add Item Modal -->
<div id="modal-item" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>Add Item</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Name *</label>
        <input id="i-name" type="text" placeholder="e.g. Sunscreen" />
      </div>
      <div class="form-group">
        <label>Qty</label>
        <input id="i-qty" type="number" min="1" value="1" />
      </div>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="i-cat">
        <option>Clothing</option>
        <option>Toiletries &amp; Hygiene</option>
        <option>Documents</option>
        <option>Electronics</option>
        <option>Medications</option>
        <option>Shoes &amp; Accessories</option>
        <option>Food &amp; Drinks</option>
        <option>Sports &amp; Fitness</option>
        <option>Baby &amp; Kids</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label><input id="i-essential" type="checkbox" /> Essential</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btn-cancel-item">Cancel</button>
      <button class="btn btn-primary" id="btn-save-item">Add Item</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────────────────
// Relative-path API helpers (HA ingress safe)
// ────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);   // relative — no leading /
  if (!res.ok) throw new Error(await res.text());
  if (res.status === 204) return null;
  return res.json();
}
const GET    = p      => api('GET',    p);
const POST   = (p, b) => api('POST',   p, b);
const PUT    = (p, b) => api('PUT',    p, b);
const DELETE = p      => api('DELETE', p);

// ────────────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────────────
let trips      = [];
let activities = [];
let view       = 'trips';     // 'trips' | 'trip'
let currentTrip = null;
let currentList = null;
let selectedActs = [];

// ────────────────────────────────────────────────────────────
// Render
// ────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  if (view === 'trips') renderTrips(root);
  else if (view === 'trip') renderTrip(root);
}

function renderTrips(root) {
  if (!trips.length) {
    root.innerHTML = '<div class="empty">No trips yet. Create your first trip! ✈️</div>';
    return;
  }
  root.innerHTML = trips.map(t => `
    <div class="card" data-id="${t.id}" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="card-title">📍 ${esc(t.destination)}</div>
          <div class="card-meta">${t.start_date} → ${t.end_date} · ${t.duration_days ?? '?'} days · ${t.traveller_count} traveller(s)</div>
          <div style="margin-top:.4rem">${(t.activities||[]).map(a=>`<span class="badge">${esc(a)}</span>`).join('')}</div>
        </div>
        <button class="btn btn-danger btn-sm del-trip" data-id="${t.id}" onclick="event.stopPropagation()">✕</button>
      </div>
      ${packingBar(t)}
    </div>
  `).join('');

  root.querySelectorAll('.card[data-id]').forEach(el => {
    el.addEventListener('click', () => openTrip(+el.dataset.id));
  });
  root.querySelectorAll('.del-trip').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteTrip(+btn.dataset.id); });
  });
}

function packingBar(t) {
  const list = t.packing_lists && t.packing_lists[0];
  if (!list) return '';
  const items = list.items || [];
  const packed = items.filter(i => i.is_packed).length;
  const total  = items.length;
  const pct    = total ? Math.round(packed / total * 100) : 0;
  return `<div style="margin-top:.5rem">
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card-meta">${packed}/${total} items packed (${pct}%)</div>
  </div>`;
}

function renderTrip(root) {
  const t = currentTrip;
  const list = currentList;
  const items = list ? list.items || [] : [];
  const packed = items.filter(i => i.is_packed).length;
  const total  = items.length;
  const pct    = total ? Math.round(packed / total * 100) : 0;

  // Group by category
  const byCategory = {};
  items.forEach(item => {
    const c = item.category || 'Other';
    if (!byCategory[c]) byCategory[c] = [];
    byCategory[c].push(item);
  });

  const catHTML = Object.entries(byCategory).sort(([a],[b]) => a.localeCompare(b)).map(([cat, catItems]) => `
    <div class="section-title">${esc(cat)}</div>
    ${catItems.map(item => `
      <div class="item-row">
        <input type="checkbox" ${item.is_packed ? 'checked' : ''} data-item="${item.id}" class="toggle-item" />
        <span class="item-name ${item.is_packed ? 'packed' : ''}">${esc(item.name)}${item.quantity > 1 ? ` ×${item.quantity}` : ''}${item.is_essential ? ' <span style="color:var(--sj-error);font-size:.75rem">★</span>' : ''}</span>
        <button class="btn btn-danger btn-sm del-item" data-id="${item.id}">✕</button>
      </div>
    `).join('')}
  `).join('');

  root.innerHTML = `
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem">
      <button class="btn btn-ghost btn-sm" id="btn-back">← Back</button>
      <h2 style="font-size:1.1rem;font-weight:700">📍 ${esc(t.destination)}</h2>
    </div>
    <div class="card">
      <div class="card-meta">${t.start_date} → ${t.end_date} · ${t.duration_days ?? '?'} days · ${t.traveller_count} traveller(s)</div>
      <div style="margin-top:.4rem">${(t.activities||[]).map(a=>`<span class="badge">${esc(a)}</span>`).join('')}</div>
      <div class="progress-bar" style="margin-top:.6rem"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card-meta">${packed}/${total} items packed (${pct}%)</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <div class="section-title" style="margin:0">Packing List</div>
      <button class="btn btn-primary btn-sm" id="btn-add-item">+ Add Item</button>
    </div>
    ${items.length ? catHTML : '<div class="empty">No items yet. Add some! 📦</div>'}
  `;

  root.querySelector('#btn-back').onclick = () => { view = 'trips'; currentTrip = null; currentList = null; loadTrips(); };
  root.querySelector('#btn-add-item').onclick = openAddItem;
  root.querySelectorAll('.toggle-item').forEach(cb => {
    cb.addEventListener('change', () => toggleItem(+cb.dataset.item));
  });
  root.querySelectorAll('.del-item').forEach(btn => {
    btn.addEventListener('click', () => deleteItem(+btn.dataset.id));
  });
}

// ────────────────────────────────────────────────────────────
// Trip CRUD
// ────────────────────────────────────────────────────────────
async function loadTrips() {
  const root = document.getElementById('root');
  root.innerHTML = '<div class="loading">Loading…</div>';
  trips = await GET('trips');
  render();
}

async function openTrip(id) {
  const trip = trips.find(t => t.id === id);
  currentTrip = trip;
  // Load full list with items
  const lists = await GET(`trips/${id}/lists`);
  currentList = lists[0] || null;
  if (currentList) {
    const items = await GET(`lists/${currentList.id}/items`);
    currentList.items = items;
  }
  view = 'trip';
  render();
}

async function deleteTrip(id) {
  if (!confirm('Delete this trip?')) return;
  await DELETE(`trips/${id}`);
  trips = trips.filter(t => t.id !== id);
  render();
}

async function createTrip() {
  const dest  = document.getElementById('f-dest').value.trim();
  const start = document.getElementById('f-start').value;
  const end   = document.getElementById('f-end').value;
  const err   = document.getElementById('trip-error');

  if (!dest || !start || !end) { err.innerHTML = '<div class="error-msg">Please fill in all required fields.</div>'; return; }
  if (start > end)              { err.innerHTML = '<div class="error-msg">End date must be after start date.</div>'; return; }

  const body = {
    destination: dest,
    start_date: start,
    end_date: end,
    traveller_count: +document.getElementById('f-travellers').value || 1,
    activities: selectedActs,
    notes: document.getElementById('f-notes').value.trim() || null,
  };

  try {
    const trip = await POST('trips', body);
    trips.unshift(trip);
    closeModal('modal-trip');
    render();
  } catch (e) {
    err.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`;
  }
}

// ────────────────────────────────────────────────────────────
// Item CRUD
// ────────────────────────────────────────────────────────────
async function toggleItem(itemId) {
  const item = await POST(`items/${itemId}/toggle`);
  const idx = currentList.items.findIndex(i => i.id === itemId);
  if (idx !== -1) currentList.items[idx] = item;
  render();
}

async function deleteItem(itemId) {
  await DELETE(`items/${itemId}`);
  currentList.items = currentList.items.filter(i => i.id !== itemId);
  render();
}

async function addItem() {
  const name = document.getElementById('i-name').value.trim();
  if (!name) return;
  const body = {
    name,
    category: document.getElementById('i-cat').value,
    quantity: +document.getElementById('i-qty').value || 1,
    is_essential: document.getElementById('i-essential').checked,
    added_by: 'user',
  };
  const item = await POST(`lists/${currentList.id}/items`, body);
  currentList.items.push(item);
  closeModal('modal-item');
  render();
}

// ────────────────────────────────────────────────────────────
// Activities picker
// ────────────────────────────────────────────────────────────
async function loadActivities() {
  activities = await GET('activities');
  renderActivityPicker();
}

function renderActivityPicker() {
  const el = document.getElementById('activity-picker');
  if (!el) return;
  el.innerHTML = activities.map(a => `
    <button class="activity-btn ${selectedActs.includes(a.slug) ? 'selected' : ''}" data-slug="${a.slug}">
      ${a.icon_emoji} ${esc(a.name)}
    </button>
  `).join('');
  el.querySelectorAll('.activity-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const slug = btn.dataset.slug;
      selectedActs = selectedActs.includes(slug)
        ? selectedActs.filter(s => s !== slug)
        : [...selectedActs, slug];
      renderActivityPicker();
    });
  });
}

// ────────────────────────────────────────────────────────────
// Modal helpers
// ────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openAddItem() {
  document.getElementById('i-name').value = '';
  document.getElementById('i-qty').value = '1';
  document.getElementById('i-essential').checked = false;
  openModal('modal-item');
}

// ────────────────────────────────────────────────────────────
// Escape HTML
// ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ────────────────────────────────────────────────────────────
// Wire up events
// ────────────────────────────────────────────────────────────
document.getElementById('btn-new-trip').onclick = () => {
  selectedActs = [];
  document.getElementById('f-dest').value = '';
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-travellers').value = '1';
  document.getElementById('trip-error').innerHTML = '';
  renderActivityPicker();
  openModal('modal-trip');
};
document.getElementById('btn-cancel-trip').onclick = () => closeModal('modal-trip');
document.getElementById('btn-save-trip').onclick = createTrip;
document.getElementById('btn-cancel-item').onclick = () => closeModal('modal-item');
document.getElementById('btn-save-item').onclick = addItem;

// Close modals on backdrop click
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.style.display = 'none'; });
});

// ────────────────────────────────────────────────────────────
// Boot
// ────────────────────────────────────────────────────────────
loadActivities();
loadTrips();
</script>
</body>
</html>
