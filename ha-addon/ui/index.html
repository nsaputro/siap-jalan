<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siap Jalan</title>
  <style>
    :root {
      --bg:      var(--primary-background-color,   #f5f5f5);
      --card:    var(--card-background-color,      #ffffff);
      --text:    var(--primary-text-color,         #212121);
      --text2:   var(--secondary-text-color,       #727272);
      --muted:   var(--disabled-text-color,        #9ca3af);
      --accent:  var(--primary-color,              #2563eb);
      --div:     var(--divider-color,              #e0e0e0);
      --err:     var(--error-color,                #ef4444);
      --track:   var(--secondary-background-color, #e5e7eb);
      --shadow:  var(--ha-card-box-shadow,         0 1px 3px rgba(0,0,0,.08));
      --overlay: rgba(0,0,0,.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     var(--primary-background-color,   #111827);
        --card:   var(--card-background-color,      #1f2937);
        --text:   var(--primary-text-color,         #f3f4f6);
        --text2:  var(--secondary-text-color,       #9ca3af);
        --muted:  var(--disabled-text-color,        #6b7280);
        --accent: var(--primary-color,              #3b82f6);
        --div:    var(--divider-color,              #374151);
        --err:    var(--error-color,                #f87171);
        --track:  var(--secondary-background-color, #374151);
        --shadow: var(--ha-card-box-shadow,         0 1px 3px rgba(0,0,0,.35));
        --overlay: rgba(0,0,0,.6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #app { max-width: 640px; margin: 0 auto; padding: .75rem; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 0 .6rem; margin-bottom: .75rem;
      border-bottom: 1px solid var(--div);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header h1 span { color: var(--accent); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .4rem .8rem; border-radius: 6px; border: none;
      cursor: pointer; font-size: .875rem; font-weight: 500; transition: opacity .15s;
    }
    .btn:hover { opacity: .82; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--div); color: var(--text); }
    .btn-sm { padding: .25rem .55rem; font-size: .8rem; }
    .btn-icon {
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); padding: .2rem; line-height: 1; font-size: 1rem; transition: color .15s;
    }
    .btn-icon:hover { color: var(--err); }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex; border-bottom: 1px solid var(--div); margin-bottom: .75rem; gap: 0;
    }
    .tab-btn {
      flex: 1; padding: .5rem; border: none; background: transparent;
      color: var(--text2); font-size: .875rem; font-weight: 500; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Trip card ── */
    .trip-card {
      background: var(--card); border-radius: 10px; box-shadow: var(--shadow);
      padding: .9rem 1rem; margin-bottom: .6rem; cursor: pointer; transition: opacity .15s;
    }
    .trip-card:hover { opacity: .9; }
    .trip-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .trip-dest { font-weight: 600; font-size: 1rem; }
    .trip-dates { font-size: .78rem; color: var(--text2); margin-top: .15rem; }
    .badges { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .4rem; }
    .badge {
      padding: .1rem .45rem; border-radius: 999px; font-size: .7rem; font-weight: 500;
      background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
    }
    .progress-bar { background: var(--track); border-radius: 999px; height: 5px; overflow: hidden; margin-top: .55rem; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
    .progress-label { font-size: .72rem; color: var(--text2); margin-top: .2rem; }

    /* ── Trip detail ── */
    .detail-header { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .detail-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .detail-meta { font-size: .78rem; color: var(--text2); margin-bottom: .5rem; }

    /* ── Packing card ── */
    .pack-card {
      background: var(--card); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
    }
    .pack-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .65rem 1rem; border-bottom: 1px solid var(--div);
    }
    .pack-card-title { font-size: .82rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
    .pack-count { font-size: .82rem; color: var(--text2); }
    .pack-count.done { color: var(--accent); font-weight: 600; }

    /* ── Item row ── */
    .item-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .55rem 1rem; border-bottom: 1px solid color-mix(in srgb, var(--div) 60%, transparent);
    }
    .item-row:last-of-type { border-bottom: none; }

    /* Circle checkbox */
    .item-check {
      appearance: none; -webkit-appearance: none;
      width: 1.25rem; height: 1.25rem; border-radius: 50%;
      border: 2px solid var(--div); flex-shrink: 0; cursor: pointer;
      background: transparent; transition: all .15s; position: relative;
    }
    .item-check:checked { background: var(--accent); border-color: var(--accent); }
    .item-check:checked::after {
      content: ''; position: absolute; top: 2px; left: 5px;
      width: 4px; height: 8px; border: 2px solid #fff;
      border-top: none; border-left: none; transform: rotate(45deg);
    }
    .item-name { flex: 1; font-size: .9rem; }
    .item-name.packed { text-decoration: line-through; color: var(--muted); }

    /* ── Inline add row ── */
    .add-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .55rem 1rem;
    }
    .add-icon { color: var(--text2); font-size: 1.15rem; flex-shrink: 0; line-height: 1; }
    .add-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: .88rem; color: var(--text); font-family: inherit;
    }
    .add-input::placeholder { color: var(--muted); }

    /* ── Modal ── */
    .modal-bg {
      position: fixed; inset: 0; background: var(--overlay);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--card); border-radius: 14px; padding: 1.25rem;
      width: min(95vw, 460px); max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .form-group { margin-bottom: .7rem; }
    .form-group label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: .25rem; color: var(--text2); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: .4rem .55rem; border: 1px solid var(--div); border-radius: 6px;
      font-size: .875rem; background: var(--bg); color: var(--text); outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 70px; resize: vertical; font-family: inherit; }
    .form-row { display: flex; gap: .5rem; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: .9rem; }
    .activity-grid { display: flex; flex-wrap: wrap; gap: .35rem; }
    .activity-btn {
      padding: .3rem .65rem; border-radius: 999px;
      border: 1px solid var(--div); background: var(--card); color: var(--text);
      cursor: pointer; font-size: .8rem; transition: all .15s;
    }
    .activity-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Activity section headers (packing list) ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem .3rem;
      font-size: .75rem; font-weight: 600; letter-spacing: .06em;
      color: var(--text2); text-transform: uppercase;
      background: color-mix(in srgb, var(--div) 35%, transparent);
      border-top: 1px solid var(--div);
    }
    /* Avoid double border when section follows pack-card-header */
    .pack-card-header + .section-header { border-top: none; }
    .section-count { font-weight: 400; font-size: .75rem; }

    /* ── Template cards (Activities tab) ── */
    .tmpl-card {
      background: var(--card); border-radius: 10px; box-shadow: var(--shadow);
      padding: .75rem 1rem; margin-bottom: .5rem;
      display: flex; align-items: center; gap: .65rem;
    }
    .tmpl-icon { font-size: 1.4rem; flex-shrink: 0; }
    .tmpl-info { flex: 1; min-width: 0; }
    .tmpl-name { font-weight: 600; font-size: .95rem; }
    .tmpl-meta { font-size: .75rem; color: var(--text2); }
    .tmpl-actions { display: flex; gap: .35rem; flex-shrink: 0; }

    /* ── Section label (Activities tab) ── */
    .section-label {
      font-size: .72rem; font-weight: 600; letter-spacing: .07em;
      color: var(--text2); text-transform: uppercase;
      padding: .5rem 0 .25rem; margin-top: .4rem;
    }

    /* ── Template edit screen ── */
    .edit-field {
      display: flex; align-items: center; gap: .5rem;
      padding: .6rem 1rem; border-bottom: 1px solid var(--div);
    }
    .edit-field label {
      font-size: .8rem; color: var(--text2);
      width: 4.5rem; flex-shrink: 0;
    }
    .edit-field input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: .9rem; color: var(--text); font-family: inherit;
    }
    .edit-field input:focus { border-bottom: 1px solid var(--accent); }
    .tmpl-item-row {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem 1rem; border-bottom: 1px solid color-mix(in srgb, var(--div) 60%, transparent);
    }
    .tmpl-item-hidden { opacity: .45; }

    /* ── Trip activity chips (detail view) ── */
    .trip-acts-bar {
      display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
      margin-bottom: .5rem;
    }
    .trip-act-chip {
      display: inline-flex; align-items: center; gap: .25rem;
      padding: .2rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 500;
      background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      cursor: pointer; transition: background .15s;
    }
    .trip-act-chip:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    .chip-x { font-size: .7rem; opacity: .65; }
    .trip-act-add-btn {
      padding: .2rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 500;
      border: 1px dashed var(--div); background: transparent; color: var(--text2);
      cursor: pointer; transition: all .15s;
    }
    .trip-act-add-btn:hover { border-color: var(--accent); color: var(--accent); }
    .act-picker-panel {
      background: var(--card); border-radius: 8px; border: 1px solid var(--div);
      padding: .5rem; margin-bottom: .5rem; display: flex; flex-wrap: wrap; gap: .3rem;
    }
    .ess-btn {
      background: transparent; border: none; cursor: pointer; font-size: .9rem;
      padding: .1rem; line-height: 1; opacity: .35; color: var(--text2);
      transition: opacity .15s, color .15s;
    }
    .ess-btn.on { opacity: 1; color: #f59e0b; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg); border-radius: 8px;
      padding: .5rem 1.1rem; font-size: .83rem; z-index: 200;
      opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── Misc ── */
    .empty  { text-align: center; color: var(--muted); padding: 2.5rem 0; font-size: .88rem; }
    .loading { text-align: center; color: var(--text2); padding: 2rem 0; font-size: .88rem; }
    .err-banner {
      background: color-mix(in srgb, var(--err) 12%, transparent);
      color: var(--err); border-radius: 6px; padding: .45rem .7rem;
      font-size: .82rem; margin-bottom: .6rem;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧳 Siap <span>Jalan</span></h1>
    <div style="display:flex;gap:.4rem;align-items:center">
      <button class="btn btn-ghost btn-sm" id="btn-export" title="Export active &amp; future trips + custom activities">↓ Export</button>
      <button class="btn btn-ghost btn-sm" id="btn-import-trigger" title="Import from a SiapJalan JSON file">↑ Import</button>
      <input type="file" id="btn-import-file" accept=".json,application/json" style="display:none" />
      <button class="btn btn-primary btn-sm" id="btn-header-action">+ New Trip</button>
    </div>
  </header>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-trips">🧳 Trips</button>
    <button class="tab-btn" id="tab-activities">🎒 Activities</button>
  </div>

  <div id="root"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- New Trip Modal -->
<div id="modal-trip" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>New Trip</h2>
    <div id="trip-err"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Destination *</label>
        <input id="f-dest" type="text" placeholder="e.g. Bali" />
      </div>
      <div class="form-group" style="max-width:90px">
        <label>Travellers</label>
        <input id="f-travellers" type="number" min="1" value="1" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date *</label>
        <input id="f-start" type="date" />
      </div>
      <div class="form-group">
        <label>End Date *</label>
        <input id="f-end" type="date" />
      </div>
    </div>
    <div class="form-group">
      <label>Activities</label>
      <div id="activity-picker" class="activity-grid">
        <span style="color:var(--muted);font-size:.8rem">Loading…</span>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Anything to remember…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="btn-cancel-trip">Cancel</button>
      <button class="btn btn-primary btn-sm" id="btn-save-trip">Create Trip</button>
    </div>
  </div>
</div>

<!-- Clone Activity Modal -->
<div id="modal-clone" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>Clone Activity</h2>
    <div id="clone-err"></div>
    <div class="form-group">
      <label>New Name *</label>
      <input id="f-clone-name" type="text" placeholder="My custom activity name" />
    </div>
    <div class="form-group">
      <label>Emoji (optional)</label>
      <input id="f-clone-emoji" type="text" placeholder="Leave blank to inherit" style="max-width:80px" />
    </div>
    <input type="hidden" id="f-clone-slug" />
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="btn-cancel-clone">Cancel</button>
      <button class="btn btn-primary btn-sm" id="btn-save-clone">Clone</button>
    </div>
  </div>
</div>

<!-- New Activity Modal -->
<div id="modal-new-activity" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>New Activity Template</h2>
    <div id="new-act-err"></div>
    <div class="form-row">
      <div class="form-group">
        <label>Name *</label>
        <input id="f-act-name" type="text" placeholder="e.g. Yoga Retreat" />
      </div>
      <div class="form-group" style="max-width:80px">
        <label>Emoji</label>
        <input id="f-act-emoji" type="text" placeholder="🎒" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" id="btn-cancel-new-act">Cancel</button>
      <button class="btn btn-primary btn-sm" id="btn-save-new-act">Create</button>
    </div>
  </div>
</div>

<script>
// ── API (relative paths — HA ingress safe) ────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  if (res.status === 204) return null;
  return res.json();
}
const GET    = p      => api('GET',    p);
const POST   = (p, b) => api('POST',   p, b);
const PUT    = (p, b) => api('PUT',    p, b);
const DELETE = p      => api('DELETE', p);

// ── State ─────────────────────────────────────────────────────────────────────
let trips           = [];
let activities      = [];
let selectedActs    = [];
let view            = 'trips';   // 'trips' | 'trip' | 'activities' | 'tmpl-edit'
let activeTab       = 'trips';   // 'trips' | 'activities'
let currentTrip     = null;
let currentList     = null;
let currentTemplate = null;      // ActivityTemplate being edited

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ── Render dispatcher ─────────────────────────────────────────────────────────
function render() {
  if (view === 'trips')       return renderTrips();
  if (view === 'trip')        return renderTrip();
  if (view === 'activities')  return renderActivitiesTab();
  if (view === 'tmpl-edit')   return renderTemplateEdit();
}

function setTab(tab) {
  activeTab = tab;
  document.getElementById('tab-trips').classList.toggle('active', tab === 'trips');
  document.getElementById('tab-activities').classList.toggle('active', tab === 'activities');
  const actionBtn = document.getElementById('btn-header-action');
  if (tab === 'trips') {
    actionBtn.textContent = '+ New Trip';
    actionBtn.onclick = openNewTripModal;
  } else {
    actionBtn.textContent = '+ New Activity';
    actionBtn.onclick = openNewActivityModal;
  }
}

// ── Trip list ─────────────────────────────────────────────────────────────────
function renderTrips() {
  const root = document.getElementById('root');
  if (!trips.length) {
    root.innerHTML = '<div class="empty">No trips yet — create one to start packing ✈️</div>';
    return;
  }
  // Build slug → activity lookup for badge labels
  const actMap = {};
  activities.forEach(a => { actMap[a.slug] = a; });

  root.innerHTML = trips.map(t => {
    const items  = t.packing_lists?.[0]?.items || [];
    const packed = items.filter(i => i.is_packed).length;
    const total  = items.length;
    const pct    = total ? Math.round(packed / total * 100) : 0;
    const days   = t.duration_days ?? Math.round((new Date(t.end_date) - new Date(t.start_date)) / 86400000);
    const acts   = (t.activities || []).map(a => {
      const act = actMap[a];
      return `<span class="badge">${act ? `${act.icon_emoji} ${esc(act.name)}` : esc(a)}</span>`;
    }).join('');
    return `
      <div class="trip-card" data-id="${t.id}">
        <div class="trip-card-top">
          <div>
            <div class="trip-dest">📍 ${esc(t.destination)}</div>
            <div class="trip-dates">${t.start_date} → ${t.end_date} · ${days} days</div>
          </div>
          <button class="btn-icon del-trip" data-id="${t.id}">✕</button>
        </div>
        ${acts ? `<div class="badges">${acts}</div>` : ''}
        ${total ? `
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${packed} / ${total} packed</div>
        ` : ''}
      </div>`;
  }).join('');

  root.querySelectorAll('.trip-card').forEach(el =>
    el.addEventListener('click', () => openTrip(+el.dataset.id))
  );
  root.querySelectorAll('.del-trip').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); deleteTrip(+btn.dataset.id); })
  );
}

// ── Trip detail ───────────────────────────────────────────────────────────────
function renderItemRow(item) {
  return `
    <div class="item-row">
      <input type="checkbox" class="item-check toggle-item"
             data-item="${item.id}" ${item.is_packed ? 'checked' : ''} />
      <span class="item-name ${item.is_packed ? 'packed' : ''}">
        ${esc(item.name)}${item.quantity > 1 ? ` ×${item.quantity}` : ''}
      </span>
      <button class="btn-icon del-item" data-id="${item.id}">✕</button>
    </div>
  `;
}

function addRowHTML(slug, placeholder) {
  return `
    <div class="add-row">
      <span class="add-icon">+</span>
      <input class="add-input section-add" type="text"
             data-slug="${esc(slug)}" placeholder="${esc(placeholder)}" />
    </div>
  `;
}

function renderTrip() {
  const root   = document.getElementById('root');
  const t      = currentTrip;
  const items  = currentList?.items || [];
  const packed = items.filter(i => i.is_packed).length;
  const total  = items.length;
  const done   = total > 0 && packed === total;

  // Activity lookup map: slug → {name, icon_emoji}
  const actMap = {};
  activities.forEach(a => { actMap[a.slug] = a; });

  const tripActSlugs = t.activities || [];
  let sectionsHTML = '';

  if (tripActSlugs.length > 0) {
    // Build per-activity item buckets (trip activity order)
    const groupMap = {};
    tripActSlugs.forEach(s => { groupMap[s] = []; });
    const generalItems = [];

    items.forEach(item => {
      const srcs = item.source_activities || [];
      const match = srcs.find(s => groupMap[s] !== undefined);
      if (match) groupMap[match].push(item);
      else generalItems.push(item);
    });

    // Render one section per activity
    tripActSlugs.forEach(slug => {
      const group  = groupMap[slug];
      const act    = actMap[slug];
      const label  = act ? `${act.icon_emoji} ${esc(act.name)}` : esc(slug);
      const gPack  = group.filter(i => i.is_packed).length;
      const gTotal = group.length;
      sectionsHTML += `
        <div class="section-header">
          <span>${label}</span>
          ${gTotal > 0 ? `<span class="section-count">${gPack} / ${gTotal}</span>` : ''}
        </div>
        ${group.map(renderItemRow).join('')}
        ${addRowHTML(slug, `Add to ${act ? act.name : slug}…`)}
      `;
    });

    // General section — always shown so users can add non-activity items
    const gPack2  = generalItems.filter(i => i.is_packed).length;
    const gTotal2 = generalItems.length;
    sectionsHTML += `
      <div class="section-header">
        <span>General</span>
        ${gTotal2 > 0 ? `<span class="section-count">${gPack2} / ${gTotal2}</span>` : ''}
      </div>
      ${generalItems.map(renderItemRow).join('')}
      ${addRowHTML('', 'Add general item…')}
    `;
  } else {
    // No activities — flat list with a single add row
    sectionsHTML = items.map(renderItemRow).join('') + addRowHTML('', 'Type to add new item…');
  }

  const days = t.duration_days ?? Math.round((new Date(t.end_date) - new Date(t.start_date)) / 86400000);

  // Activity chips for the detail view (editable)
  const actChipsHTML = tripActSlugs.map(slug => {
    const act = actMap[slug];
    const label = act ? `${act.icon_emoji} ${esc(act.name)}` : esc(slug);
    return `<button class="trip-act-chip remove-act" data-slug="${esc(slug)}">${label} <span class="chip-x">✕</span></button>`;
  }).join('');

  root.innerHTML = `
    <div class="detail-header">
      <button class="btn btn-ghost btn-sm" id="btn-back">← Back</button>
      <span class="detail-title">📍 ${esc(t.destination)}</span>
    </div>
    <div class="detail-meta">
      ${t.start_date} → ${t.end_date} · ${days} days
    </div>
    <div class="trip-acts-bar" id="trip-acts-bar">
      ${actChipsHTML}
      <button class="trip-act-add-btn" id="btn-trip-add-act">+ Activity</button>
    </div>
    <div id="trip-act-picker" class="act-picker-panel" style="display:none"></div>
    <div class="pack-card">
      <div class="pack-card-header">
        <span class="pack-card-title">Packing List</span>
        <span class="pack-count ${done ? 'done' : ''}">${packed} / ${total}</span>
      </div>
      ${sectionsHTML}
    </div>
  `;

  document.getElementById('btn-back').onclick = () => {
    view = 'trips'; currentTrip = null; currentList = null; loadTrips();
  };
  root.querySelectorAll('.toggle-item').forEach(cb =>
    cb.addEventListener('change', () => toggleItem(+cb.dataset.item))
  );
  root.querySelectorAll('.del-item').forEach(btn =>
    btn.addEventListener('click', () => deleteItem(+btn.dataset.id))
  );
  root.querySelectorAll('.section-add').forEach(inp =>
    inp.addEventListener('keydown', async e => {
      if (e.key !== 'Enter') return;
      const name = e.target.value.trim();
      if (!name) return;
      const slug = e.target.dataset.slug || null;
      e.target.value = '';
      await addItem(name, slug);
    })
  );

  // Remove activity chip
  root.querySelectorAll('.remove-act').forEach(btn =>
    btn.addEventListener('click', async () => {
      const slug = btn.dataset.slug;
      const newSlugs = (currentTrip.activities || []).filter(s => s !== slug);
      await updateTripActivities(newSlugs);
    })
  );

  // Add activity inline picker
  document.getElementById('btn-trip-add-act').addEventListener('click', () => {
    const panel = document.getElementById('trip-act-picker');
    if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
    const currentSlugs = currentTrip.activities || [];
    const available = activities.filter(a => !currentSlugs.includes(a.slug));
    if (!available.length) { showToast('All activities already added'); return; }
    panel.innerHTML = available.map(a =>
      `<button class="activity-btn add-act-btn" data-slug="${esc(a.slug)}">${a.icon_emoji} ${esc(a.name)}</button>`
    ).join('');
    panel.querySelectorAll('.add-act-btn').forEach(btn =>
      btn.addEventListener('click', async () => {
        const slug = btn.dataset.slug;
        const newSlugs = [...(currentTrip.activities || []), slug];
        await updateTripActivities(newSlugs);
      })
    );
    panel.style.display = 'flex';
  });
}

// ── Update trip activities (add / remove) ────────────────────────────────────
async function updateTripActivities(newSlugs) {
  try {
    const updated = await PUT(`trips/${currentTrip.id}`, { activities: newSlugs });
    currentTrip = updated;
    // Update in trips array
    const idx = trips.findIndex(t => t.id === updated.id);
    if (idx !== -1) trips[idx] = updated;
    // Reload packing list items via the dedicated endpoint so we always
    // get a fresh DB read (avoids stale inline data from the PUT response).
    const lists = await GET(`trips/${currentTrip.id}/lists`);
    currentList = lists[0] || null;
    if (currentList) currentList.items = await GET(`lists/${currentList.id}/items`);
    renderTrip();
    showToast('Activities updated');
  } catch (e) {
    showToast('Update failed: ' + e.message);
  }
}

// ── Activities tab ────────────────────────────────────────────────────────────
function renderActivitiesTab() {
  const root     = document.getElementById('root');
  const builtins = activities.filter(a => a.is_builtin);
  const mine     = activities.filter(a => !a.is_builtin);

  const builtinCards = builtins.map(a => `
    <div class="tmpl-card">
      <span class="tmpl-icon">${a.icon_emoji}</span>
      <div class="tmpl-info">
        <div class="tmpl-name">${esc(a.name)}</div>
        <div class="tmpl-meta">${a.items.length} items · built-in</div>
      </div>
      <div class="tmpl-actions">
        <button class="btn btn-ghost btn-sm edit-tmpl" data-id="${a.id}">Edit</button>
        <button class="btn btn-ghost btn-sm clone-tmpl"
                data-slug="${esc(a.slug)}" data-name="${esc(a.name)}"
                data-emoji="${esc(a.icon_emoji)}">Clone</button>
      </div>
    </div>
  `).join('');

  const myCards = mine.length ? mine.map(a => `
    <div class="tmpl-card">
      <span class="tmpl-icon">${a.icon_emoji}</span>
      <div class="tmpl-info">
        <div class="tmpl-name">${esc(a.name)}</div>
        <div class="tmpl-meta">${a.items.length} items · custom</div>
      </div>
      <div class="tmpl-actions">
        <button class="btn btn-ghost btn-sm edit-tmpl" data-id="${a.id}">Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--err);border-color:var(--err)"
                onclick="deleteTemplate(${a.id})">Delete</button>
      </div>
    </div>
  `).join('') : '<div class="empty" style="padding:1rem 0">No custom activities yet — edit a built-in to create a personal copy, or use the + New Activity button.</div>';

  root.innerHTML = `
    <div class="section-label">Built-in</div>
    ${builtinCards}
    <div class="section-label" style="margin-top:.75rem">My Activities</div>
    ${myCards}
  `;

  root.querySelectorAll('.clone-tmpl').forEach(btn =>
    btn.addEventListener('click', () =>
      openCloneModal(btn.dataset.slug, btn.dataset.name, btn.dataset.emoji)
    )
  );
  root.querySelectorAll('.edit-tmpl').forEach(btn =>
    btn.addEventListener('click', () => openTemplateEdit(+btn.dataset.id))
  );
}

async function openTemplateEdit(id) {
  const tmpl = activities.find(a => a.id === id) || null;
  if (!tmpl) return;

  if (tmpl.is_builtin) {
    // If the user already has a personal copy with the same name, open that.
    const existing = activities.find(a => !a.is_builtin && a.name === tmpl.name);
    if (existing) {
      currentTemplate = existing;
      view = 'tmpl-edit';
      render();
      return;
    }
    // Auto-clone the built-in into a personal copy (same name, same emoji).
    try {
      const clone = await POST(`activities/${tmpl.slug}/clone`, { name: tmpl.name, replace_source_in_trips: true });
      activities.push(clone);
      currentTemplate = clone;
      view = 'tmpl-edit';
      render();
      showToast(`Personal copy of "${tmpl.name}" created — only affects your trips`);
    } catch (e) {
      showToast('Could not create personal copy: ' + e.message);
    }
    return;
  }

  currentTemplate = tmpl;
  view = 'tmpl-edit';
  render();
}

// ── Template edit screen ──────────────────────────────────────────────────────
function renderTemplateEdit() {
  const root = document.getElementById('root');
  const tmpl = currentTemplate;
  if (!tmpl) { view = 'activities'; render(); return; }

  const itemsHTML = (tmpl.items || []).map(item => `
    <div class="tmpl-item-row ${item.is_hidden ? 'tmpl-item-hidden' : ''}" data-item-id="${item.id}">
      <input type="checkbox" class="item-check vis-check" data-item-id="${item.id}"
             ${!item.is_hidden ? 'checked' : ''}
             title="${item.is_hidden ? 'Show in packing list' : 'Hide from packing list'}" />
      <button class="ess-btn ${item.is_essential && !item.is_hidden ? 'on' : ''} ess-toggle"
              data-item-id="${item.id}" title="Toggle essential"
              ${item.is_hidden ? 'style="visibility:hidden"' : ''}>★</button>
      <span class="item-name" style="flex:1;font-size:.88rem;${item.is_hidden ? 'color:var(--muted)' : ''}">
        ${esc(item.name)}
      </span>
      ${!item.is_hidden && item.quantity > 1
        ? `<span style="font-size:.78rem;color:var(--text2);margin-right:.25rem">×${item.quantity}</span>`
        : ''
      }
      ${item.is_user_added
        ? `<button class="btn-icon del-tmpl-item" data-item-id="${item.id}">✕</button>`
        : ''
      }
    </div>
  `).join('');

  root.innerHTML = `
    <div class="detail-header">
      <button class="btn btn-ghost btn-sm" id="btn-back-tmpl">← Activities</button>
      <span class="detail-title">${tmpl.icon_emoji} ${esc(tmpl.name)}</span>
    </div>
    <div class="pack-card" style="margin-bottom:.75rem">
      <div class="pack-card-header">
        <span class="pack-card-title">Template Info</span>
      </div>
      <div class="edit-field">
        <label>Name</label>
        <input id="tmpl-name-inp" type="text" value="${esc(tmpl.name)}" placeholder="Activity name" />
      </div>
      <div class="edit-field" style="border-bottom:none">
        <label>Emoji</label>
        <input id="tmpl-emoji-inp" type="text" value="${esc(tmpl.icon_emoji)}"
               placeholder="🎒" style="max-width:60px" />
      </div>
    </div>
    <div class="pack-card">
      <div class="pack-card-header">
        <span class="pack-card-title">Items</span>
        <span class="pack-count">${(tmpl.items || []).length}</span>
      </div>
      ${itemsHTML}
      <div class="add-row">
        <span class="add-icon">+</span>
        <input id="tmpl-add-item" class="add-input" type="text"
               placeholder="Add item (Enter to save)…" />
      </div>
    </div>
    <div id="tmpl-prop-msg" style="font-size:.75rem;color:var(--text2);text-align:center;margin-top:.4rem;min-height:1.2em"></div>
  `;

  document.getElementById('btn-back-tmpl').onclick = () => {
    view = 'activities'; currentTemplate = null; loadActivities();
  };

  // Auto-save name + emoji on blur
  const nameInp  = document.getElementById('tmpl-name-inp');
  const emojiInp = document.getElementById('tmpl-emoji-inp');
  async function saveTemplateInfo() {
    const newName  = nameInp.value.trim();
    const newEmoji = emojiInp.value.trim() || tmpl.icon_emoji;
    if (!newName) return;
    if (newName === tmpl.name && newEmoji === tmpl.icon_emoji) return;
    try {
      const result = await PUT(`activities/${tmpl.id}`, { name: newName, icon_emoji: newEmoji });
      currentTemplate = result.template;
      const summary = result.propagation_summary;
      const propMsg = document.getElementById('tmpl-prop-msg');
      if (propMsg) {
        const updated = summary?.trips_updated ?? 0;
        propMsg.textContent = updated
          ? `Saved — propagated to ${updated} trip${updated !== 1 ? 's' : ''}`
          : 'Saved';
      }
      showToast('Template saved');
      // Update in activities cache
      const idx = activities.findIndex(a => a.id === tmpl.id);
      if (idx !== -1) activities[idx] = currentTemplate;
    } catch (e) {
      showToast('Save failed: ' + e.message);
    }
  }
  nameInp.addEventListener('blur', saveTemplateInfo);
  emojiInp.addEventListener('blur', saveTemplateInfo);

  // Essential toggle
  root.querySelectorAll('.ess-toggle').forEach(btn =>
    btn.addEventListener('click', async () => {
      const itemId = +btn.dataset.itemId;
      const item   = (currentTemplate.items || []).find(i => i.id === itemId);
      if (!item) return;
      try {
        const updated = await PUT(`activities/${tmpl.id}/items/${itemId}`, {
          is_essential: !item.is_essential,
        });
        item.is_essential = updated.is_essential;
        if (updated.is_essential) btn.classList.add('on');
        else btn.classList.remove('on');
        showToast('Item updated');
      } catch (e) { showToast('Update failed'); }
    })
  );

  // Visibility checkbox — checked = visible, unchecked = hidden
  root.querySelectorAll('.vis-check').forEach(chk =>
    chk.addEventListener('change', async () => {
      const itemId = +chk.dataset.itemId;
      const item   = (currentTemplate.items || []).find(i => i.id === itemId);
      if (!item) return;
      const newHidden = !chk.checked;
      try {
        const updated = await PUT(`activities/${tmpl.id}/items/${itemId}`, {
          is_hidden: newHidden,
        });
        item.is_hidden = updated.is_hidden;
        renderTemplateEdit();
        showToast(updated.is_hidden ? 'Item hidden from packing list' : 'Item shown in packing list');
      } catch (e) { chk.checked = !newHidden; showToast('Update failed'); }
    })
  );

  // Delete item (user-added items only)
  root.querySelectorAll('.del-tmpl-item').forEach(btn =>
    btn.addEventListener('click', async () => {
      const itemId = +btn.dataset.itemId;
      try {
        await DELETE(`activities/${tmpl.id}/items/${itemId}`);
        currentTemplate.items = (currentTemplate.items || []).filter(i => i.id !== itemId);
        renderTemplateEdit();
        showToast('Item removed');
      } catch (e) { showToast('Delete failed'); }
    })
  );

  // Add item
  document.getElementById('tmpl-add-item').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const name = e.target.value.trim();
    if (!name) return;
    e.target.value = '';
    try {
      const item = await POST(`activities/${tmpl.id}/items`, {
        name, quantity: 1, is_essential: false, priority: 0, gender_filter: 'all',
      });
      if (!currentTemplate.items) currentTemplate.items = [];
      currentTemplate.items.push(item);
      renderTemplateEdit();
      showToast('Item added');
      // Re-focus add input
      const inp = document.getElementById('tmpl-add-item');
      if (inp) inp.focus();
    } catch (e) { showToast('Add failed: ' + e.message); }
  });
}

// ── Template CRUD ─────────────────────────────────────────────────────────────
async function deleteTemplate(id) {
  if (!confirm('Delete this custom activity template?')) return;
  try {
    await DELETE(`activities/${id}`);
    activities = activities.filter(a => a.id !== id);
    renderActivitiesTab();
    showToast('Template deleted');
  } catch (e) {
    showToast('Delete failed: ' + e.message);
  }
}

// ── Clone modal ───────────────────────────────────────────────────────────────
function openCloneModal(slug, defaultName, defaultEmoji) {
  document.getElementById('f-clone-name').value  = 'My ' + defaultName;
  document.getElementById('f-clone-emoji').value = '';
  document.getElementById('f-clone-slug').value  = slug;
  document.getElementById('clone-err').innerHTML = '';
  openModal('modal-clone');
}

async function saveClone() {
  const name  = document.getElementById('f-clone-name').value.trim();
  const emoji = document.getElementById('f-clone-emoji').value.trim() || null;
  const slug  = document.getElementById('f-clone-slug').value;
  const errEl = document.getElementById('clone-err');
  errEl.innerHTML = '';
  if (!name) {
    errEl.innerHTML = '<div class="err-banner">Please enter a name.</div>';
    return;
  }
  try {
    const tmpl = await POST(`activities/${slug}/clone`, { name, icon_emoji: emoji });
    activities.push(tmpl);
    closeModal('modal-clone');
    renderActivitiesTab();
    showToast(`"${tmpl.name}" created`);
  } catch (e) {
    errEl.innerHTML = `<div class="err-banner">${esc(e.message)}</div>`;
  }
}

// ── New Activity modal ────────────────────────────────────────────────────────
function openNewActivityModal() {
  document.getElementById('f-act-name').value  = '';
  document.getElementById('f-act-emoji').value = '';
  document.getElementById('new-act-err').innerHTML = '';
  openModal('modal-new-activity');
}

async function saveNewActivity() {
  const name  = document.getElementById('f-act-name').value.trim();
  const emoji = document.getElementById('f-act-emoji').value.trim() || '🎒';
  const errEl = document.getElementById('new-act-err');
  errEl.innerHTML = '';
  if (!name) {
    errEl.innerHTML = '<div class="err-banner">Please enter a name.</div>';
    return;
  }
  try {
    const tmpl = await POST('activities', { name, icon_emoji: emoji, items: [] });
    activities.push(tmpl);
    closeModal('modal-new-activity');
    // Open edit screen for the new template
    currentTemplate = tmpl;
    view = 'tmpl-edit';
    render();
    showToast(`"${tmpl.name}" created — add items below`);
  } catch (e) {
    errEl.innerHTML = `<div class="err-banner">${esc(e.message)}</div>`;
  }
}

// ── Trip CRUD ─────────────────────────────────────────────────────────────────
async function loadTrips() {
  document.getElementById('root').innerHTML = '<div class="loading">Loading…</div>';
  trips = await GET('trips');
  render();
}

async function openTrip(id) {
  currentTrip = trips.find(t => t.id === id);
  const lists = await GET(`trips/${id}/lists`);
  currentList = lists[0] || null;
  if (currentList) currentList.items = await GET(`lists/${currentList.id}/items`);
  view = 'trip';
  render();
}

async function deleteTrip(id) {
  if (!confirm('Delete this trip?')) return;
  await DELETE(`trips/${id}`);
  trips = trips.filter(t => t.id !== id);
  render();
}

function openNewTripModal() {
  selectedActs = ['essentials', 'toiletries'];
  ['f-dest','f-start','f-end','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-travellers').value = '1';
  document.getElementById('trip-err').innerHTML = '';
  renderActivityPicker();
  openModal('modal-trip');
}

async function createTrip() {
  const dest  = document.getElementById('f-dest').value.trim();
  const start = document.getElementById('f-start').value;
  const end   = document.getElementById('f-end').value;
  const errEl = document.getElementById('trip-err');
  errEl.innerHTML = '';
  if (!dest || !start || !end) {
    errEl.innerHTML = '<div class="err-banner">Please fill in destination and dates.</div>';
    return;
  }
  if (start > end) {
    errEl.innerHTML = '<div class="err-banner">End date must be after start date.</div>';
    return;
  }
  try {
    const trip = await POST('trips', {
      destination: dest, start_date: start, end_date: end,
      traveller_count: +document.getElementById('f-travellers').value || 1,
      activities: selectedActs,
      notes: document.getElementById('f-notes').value.trim() || null,
    });
    trips.unshift(trip);
    closeModal('modal-trip');
    render();
  } catch (e) {
    errEl.innerHTML = `<div class="err-banner">${esc(e.message)}</div>`;
  }
}

// ── Item CRUD ─────────────────────────────────────────────────────────────────
async function addItem(name, activitySlug = null) {
  if (!currentList) return;
  const body = { name, quantity: 1, is_essential: false, added_by: activitySlug ? 'adhoc' : 'user' };
  if (activitySlug) body.source_activity = activitySlug;
  const item = await POST(`lists/${currentList.id}/items`, body);
  currentList.items.push(item);
  renderTrip();
  // Re-focus the same add input
  const refSlug = activitySlug ?? '';
  const inp = document.querySelector(`.section-add[data-slug="${refSlug}"]`);
  if (inp) inp.focus();
}

async function toggleItem(itemId) {
  const item = await POST(`items/${itemId}/toggle`);
  const idx  = currentList.items.findIndex(i => i.id === itemId);
  if (idx !== -1) currentList.items[idx] = item;
  renderTrip();
}

async function deleteItem(itemId) {
  await DELETE(`items/${itemId}`);
  currentList.items = currentList.items.filter(i => i.id !== itemId);
  renderTrip();
}

// ── Activities loader + picker ────────────────────────────────────────────────
async function loadActivities() {
  activities = await GET('activities');
  if (view === 'activities') renderActivitiesTab();
  else renderActivityPicker();
}

function renderActivityPicker() {
  const el = document.getElementById('activity-picker');
  if (!el) return;
  el.innerHTML = activities.map(a => `
    <button class="activity-btn ${selectedActs.includes(a.slug) ? 'selected' : ''}"
            data-slug="${a.slug}">${a.icon_emoji} ${esc(a.name)}</button>
  `).join('');
  el.querySelectorAll('.activity-btn').forEach(btn =>
    btn.addEventListener('click', () => {
      const s = btn.dataset.slug;
      selectedActs = selectedActs.includes(s)
        ? selectedActs.filter(x => x !== s) : [...selectedActs, s];
      renderActivityPicker();
    })
  );
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Wire up ───────────────────────────────────────────────────────────────────
// Tab switching
document.getElementById('tab-trips').addEventListener('click', () => {
  if (activeTab === 'trips' && view === 'trips') return;
  setTab('trips');
  view = 'trips';
  loadTrips();
});
document.getElementById('tab-activities').addEventListener('click', () => {
  if (activeTab === 'activities' && view === 'activities') return;
  setTab('activities');
  view = 'activities';
  loadActivities();
});

// Header action button (default: new trip)
document.getElementById('btn-header-action').onclick = openNewTripModal;

// New trip modal
document.getElementById('btn-cancel-trip').onclick = () => closeModal('modal-trip');
document.getElementById('btn-save-trip').onclick   = createTrip;

// Clone modal
document.getElementById('btn-cancel-clone').onclick = () => closeModal('modal-clone');
document.getElementById('btn-save-clone').onclick   = saveClone;

// New activity modal
document.getElementById('btn-cancel-new-act').onclick = () => closeModal('modal-new-activity');
document.getElementById('btn-save-new-act').onclick   = saveNewActivity;

// Close modals on backdrop click
document.querySelectorAll('.modal-bg').forEach(bg =>
  bg.addEventListener('click', e => { if (e.target === bg) bg.style.display = 'none'; })
);

// ── Export ────────────────────────────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', async () => {
  try {
    const res = await fetch('export');
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `siapjalan-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    showToast('Export failed: ' + e.message, 3500);
  }
});

// ── Import ────────────────────────────────────────────────────────────────────
document.getElementById('btn-import-trigger').addEventListener('click', () => {
  document.getElementById('btn-import-file').click();
});

document.getElementById('btn-import-file').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const payload = JSON.parse(await file.text());
    const result  = await POST('import', payload);
    const msg = `Imported ${result.trips_imported} trip(s) and ${result.activities_imported} activity template(s)`;
    showToast(result.warnings?.length ? msg + ' (with warnings)' : msg, 4000);
    loadTrips();
    loadActivities();
  } catch (e) {
    showToast('Import failed: ' + e.message, 4000);
  } finally {
    e.target.value = '';
  }
});

loadActivities();
loadTrips();
</script>
</body>
</html>
